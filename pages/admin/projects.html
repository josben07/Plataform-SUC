<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>

        Entregas

    </title>

    <link rel="stylesheet" href="../../css/admin-projects.css">

    <link rel="stylesheet" href="../../css/admin-sidebar.css">
</head>

<body>

    <div class="projects-page">

        <!-- SIDEBAR -->
    <aside class="sidebar">
        <div>
            <div class="sidebar-logo">SUClassroom</div>
            <nav class="sidebar-menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="users.html">Usuarios</a>
                <a href="courses.html">Cursos</a>
                <a href="projects.html" class="active-link">Entregas</a>
                <a href="mentor.html">Mentor&iacute;as</a>
                <a href="mentor-prices.html">Precios</a>
                <a href="payments.html">Pagos</a>
                <a href="settings.html">Configuraci&oacute;n</a>
                <a href="assign-mentor-course.html">Asignar Mentores</a>
            </nav>
        </div>

        <button class="logout-btn" id="logoutBtn">Cerrar sesi&oacute;n</button>
    </aside>

        <!-- CONTENT -->

        <main class="projects-content">

            <div class="projects-topbar">

                <h2>

                    Entregas de alumnos

                </h2>

                <p>

                    Supervisa las tareas y proyectos finales enviados por los alumnos.

                </p>

            </div>

            <div class="projects-filters">

                <input type="text" id="searchProject" placeholder="Buscar por alumno, curso, mentor o entrega...">

                <div class="type-filters">

                    <button class="filter-btn type-filter active-filter" data-type="all">

                        Todos

                    </button>

                    <button class="filter-btn type-filter" data-type="task">

                        Tareas

                    </button>

                    <button class="filter-btn type-filter" data-type="final_project">

                        Proyectos finales

                    </button>

                </div>

                <div class="status-filters">

                    <button class="filter-btn status-filter active-filter" data-status="all">

                        Todo estado

                    </button>

                    <button class="filter-btn status-filter" data-status="pending">

                        Pendientes

                    </button>

                    <button class="filter-btn status-filter" data-status="approved">

                        Aprobados

                    </button>

                    <button class="filter-btn status-filter" data-status="rejected">

                        Rechazados

                    </button>

                </div>

            </div>

            <!-- PROJECTS -->

            <div class="projects-grid" id="projectsGrid">

            </div>

        </main>

    </div>


    <div class="delivery-modal">

        <div class="delivery-modal-content">

            <span class="close-delivery-modal">✕</span>

            <h2 id="deliveryModalTitle">Detalle de entrega</h2>

            <div class="delivery-detail-grid" id="deliveryDetailGrid"></div>

            <div class="delivery-feedback-box" id="deliveryFeedbackBox"></div>

            <a href="#" target="_blank" class="delivery-link-btn" id="deliveryLinkBtn">
                Ver entrega
            </a>

        </div>

    </div>

    <div class="admin-toast">
        <span id="adminToastMessage">
            Acción realizada
        </span>
    </div>
    

    <script src="../../js/config.js"></script>
    <script src="../../js/admin-sidebar.js"></script>
    <script src="../../js/admin-projects.js"></script>

</body>

</html>
