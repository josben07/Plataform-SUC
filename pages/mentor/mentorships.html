<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mentorías | Mentor</title>
    <link rel="stylesheet" href="../../css/mentor-mentorships.css">
</head>

<body>

    <div class="mentor-page">

        <aside class="mentor-sidebar">
            <div class="mentor-logo">SUClassroom</div>

            <nav class="mentor-menu">
                <a href="./dashboard.html">📊 Dashboard</a>
                <a href="./projects.html">🚀 Proyectos</a>
                <a href="./mentorships.html" class="active-link">🎓 Mentorías</a>
                <a href="./students.html">👥 Estudiantes</a>
                <a href="./profile.html">👤 Perfil</a>
            </nav>
        </aside>

        <main class="mentor-main">

            <div class="mentor-header">
                <span>MENTORÍAS</span>
                <h1>Sesiones reservadas</h1>
                <p>Revisa las sesiones solicitadas por estudiantes.</p>
            </div>

            <div class="mentorship-grid" id="mentorSessionsGrid"></div>

        </main>

    </div>

    <div class="app-toast">
        <span id="appToastMessage">Acción realizada</span>
    </div>

    <!-- MODAL COMPLETAR MENTORÍA (MENTOR) -->
    <div class="modal-overlay" id="mentorCompleteModal">
        <div class="modal-box">
            <h2>Completar mentoría</h2>
            <p class="modal-sub">Confirma los detalles de la sesión realizada con el alumno.</p>

            <label>Subir evidencia de la sesión (opcional)</label>
            <input type="file" id="mentorEvidenceFile" accept="image/*,application/pdf">

            <label>¿Se realizó la mentoría?</label>
            <div class="radio-group">
                <label><input type="radio" name="mentor_done" value="si" checked> Sí</label>
                <label><input type="radio" name="mentor_done" value="no"> No</label>
            </div>

            <label>¿Se aprobó el proyecto final del alumno?</label>
            <div class="radio-group">
                <label><input type="radio" name="mentor_approve_project" value="si"> Sí</label>
                <label><input type="radio" name="mentor_approve_project" value="no" checked> No</label>
            </div>

            <label>¿Desea más mentorías con este alumno?</label>
            <div class="radio-group">
                <label><input type="radio" name="mentor_more" value="si"> Sí</label>
                <label><input type="radio" name="mentor_more" value="no" checked> No</label>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeMentorCompleteModal()">Cancelar</button>
                <button class="btn-submit" id="mentorCompleteSubmitBtn" onclick="submitMentorComplete()">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/mentor-mentorships.js"></script>

</body>

</html>
