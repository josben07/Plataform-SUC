<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | SUClassroom</title>
    <link rel="stylesheet" href="../../css/student-profile.css">
    <link rel="stylesheet" href="../../css/student-sidebar.css">
</head>

<body>

    <div class="student-page">

        <aside class="student-sidebar">
            <div class="student-logo">SUClassroom</div>

            <nav class="student-menu">
                <a href="./dashboard.html">📊 Dashboard</a>
                <a href="./my-courses.html">📚 Mis cursos</a>
                <a href="./projects.html">🚀 Proyectos</a>
                <a href="./mentorships.html">🎓 Mentorías</a>
                <a href="./notes.html">📝 Mis Apuntes</a>
                <a href="./certificates.html">🎓 Certificados</a>
                <a href="./payments.html">💳 Pagos</a>
                <a href="./profile.html" class="active-link">👤 Perfil</a>
            </nav>
        </aside>

        <main class="student-main">

            <div class="profile-card">

                <div class="profile-avatar" id="profileAvatar">
                    A
                </div>

                <h1 id="profileName">
                    Alumno
                </h1>

                <p id="profileEmail">
                    correo@demo.com
                </p>

                <form id="profileForm">

                    <input type="text" id="fullName" placeholder="Nombre completo" required>

                    <input type="email" id="email" placeholder="Correo" disabled>

                    <button type="submit">
                        Guardar cambios
                    </button>

                </form>

                <div class="password-section">

                    <h3>Cambiar contraseña</h3>

                    <form id="passwordForm">

                        <div class="password-wrapper">
                            <input type="password" id="currentPassword" placeholder="Contraseña actual (solo si tienes una)">
                            <span class="toggle-password">👁</span>
                        </div>

                        <div class="password-wrapper">
                            <input type="password" id="newPassword" placeholder="Nueva contraseña" required pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$" title="Mínimo 8 caracteres, una mayúscula, una minúscula y un número">
                            <span class="toggle-password">👁</span>
                        </div>

                        <div class="password-wrapper">
                            <input type="password" id="confirmPassword" placeholder="Repetir nueva contraseña" required pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$" title="Mínimo 8 caracteres, una mayúscula, una minúscula y un número">
                            <span class="toggle-password">👁</span>
                        </div>

                        <button type="submit">
                            Actualizar contraseña
                        </button>

                    </form>

                </div>

            </div>

        </main>

    </div>

    <div class="app-toast">
        <span id="appToastMessage">Acción realizada</span>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/student-sidebar.js"></script>

    <script src="../../js/student-profile.js"></script>

    <script>
        document.querySelectorAll(".toggle-password").forEach(function(btn){
            btn.addEventListener("click",function(){
                var input=btn.parentElement.querySelector("input");
                if(input.type==="password"){
                    input.type="text";
                    btn.textContent="🙈";
                }else{
                    input.type="password";
                    btn.textContent="👁";
                }
            });
        });
    </script>

</body>

</html>
