<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos | SUClassroom</title>
    <link rel="stylesheet" href="../../css/student-payments.css">
    <link rel="stylesheet" href="../../css/student-sidebar.css">
</head>

<body>

    <div class="student-page">

        <aside class="student-sidebar">
            <div class="student-logo">SUClassroom</div>

            <nav class="student-menu">
                <a href="./dashboard.html">📊 Dashboard</a>
                <a href="./my-courses.html">📚 Mis cursos</a>
                <a href="./projects.html">🚀 Proyectos</a>
                <a href="./mentorships.html">🎓 Mentorías</a>
                <a href="./notes.html">📝 Mis Apuntes</a>
                <a href="./certificates.html">🎓 Certificados</a>
                <a href="./payments.html" class="active-link">💳 Pagos</a>
                <a href="./profile.html">👤 Perfil</a>
            </nav>
        </aside>

        <main class="student-main">

            <div class="student-header">
                <span>PAGOS</span>
                <h1>Historial de pagos</h1>
                <p>Revisa tus pagos simulados y el estado de aprobación.</p>
            </div>

            <div class="payments-grid" id="paymentsGrid"></div>

        </main>

    </div>

    <div class="pay-modal">
    
        <div class="pay-modal-content">
    
            <span class="close-pay-modal">
                ✕
            </span>
    
            <h2 id="payModalTitle">
                Confirmar pago de mentoría
            </h2>
    
            <p id="payCourseName"></p>
            <p id="payAmount"></p>
    
            <div class="pay-box">

                <strong>Métodos de pago</strong>

                <div id="paymentMethodsList"></div>

            </div>
    
            <label class="payment-proof-field" for="paymentProofFile">

                Subir comprobante

                <input type="file" id="paymentProofFile" required>

            </label>

            <p class="payment-proof-name" id="paymentProofFileName">

                No hay archivo seleccionado

            </p>

            <button id="confirmPayBtn">
                Ya realicé el pago
            </button>
    
        </div>
    
    </div>

    <div class="app-toast">
        <span id="appToastMessage">Acción realizada</span>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/student-sidebar.js"></script>
    <script src="../../js/student-payments.js"></script>

</body>

</html>
