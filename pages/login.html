<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | SUClassroom
    </title>

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="../css/reset.css"
    >

    <link
        rel="stylesheet"
        href="../css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/navbar.css"
    >

    <link
        rel="stylesheet"
        href="../css/footer.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="../css/login.css"
    >

</head>

<body>

    <!-- ========================= -->
    <!-- NAVBAR -->
    <!-- ========================= -->

    <header class="navbar">

        <div class="container nav-container">

            <!-- LOGO -->

            <a
                href="../index.html"
                class="logo"
            >

                SUClassroom

            </a>

            <!-- MENU -->

            <nav class="nav-menu">

                <a href="../index.html">
                    Inicio
                </a>

                <a href="./cursos.html">
                    Cursos
                </a>

                <a href="./nosotros.html">
                    Nosotros
                </a>

                <a href="./mentores.html">
                    Mentores
                </a>

            </nav>

            <!-- BUTTONS -->

            <div class="nav-buttons">

                <button
                    class="theme-toggle"
                    id="theme-toggle"
                >

                    🌙

                </button>

            </div>

        </div>

    </header>

    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <section class="login-section">

        <div class="login-blur login-blur-1"></div>

        <div class="login-blur login-blur-2"></div>

        <div class="container login-container">

            <!-- LEFT -->

            <div class="login-content">

                <span class="login-badge">

                    Bienvenido nuevamente

                </span>

                <h1>

                    Continúa tu ruta
                    de aprendizaje y
                    desbloquea nuevos cursos

                </h1>

                <p>

                    Accede a tus cursos,
                    mentorías, proyectos y
                    progreso personalizado.

                </p>

            </div>

            <!-- RIGHT -->

            <div class="login-card">

                <h2>

                    Iniciar sesión

                </h2>

                <form id="loginForm">

                    <!-- EMAIL -->

                    <div class="input-group">

                        <label>

                            Correo electrónico

                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="correo@gmail.com"
                            required
                        >

                    </div>

                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label>

                            Contraseña

                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="********"
                            required
                        >

                    </div>

                    <!-- BUTTON -->

                    <button
                        type="submit"
                        class="login-btn"
                    >

                        Ingresar

                    </button>

                </form>

                <div class="divider">
                    <span>
                        o continúa con
                    </span>
                </div>

                <button
                    id="googleLoginBtn"
                    class="google-btn"
                >

                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                    >
                        <path
                            fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                        />
                        <path
                            fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        />
                        <path
                            fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        />
                        <path
                            fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        />
                    </svg>

                    Continuar con Google

                </button>

                <!-- REGISTER -->

                <div class="login-register">

                    ¿No tienes cuenta?

                    <a href="./registrar.html">

                        Regístrate

                    </a>

                </div>

            </div>

        </div>

    </section>

    <div class="auth-toast">
    
        <span id="authToastMessage">
            Mensaje
        </span>
    
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script src="../js/config.js">
    </script>

    <script src="../js/main.js">
    </script>

    <script src="../js/auth.js">
    </script>

</body>

</html>
